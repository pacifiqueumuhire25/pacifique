<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Future Skills Learning Center provides practical technology and professional skills training."
    >

    <title>
        Future Skills Learning Center
    </title>

    <link
        rel="icon"
        href="images/favicon.png"
    >
</head>

<body>
<nav>

    <a href="index.html">Home</a>

    <a href="about.html">About</a>

    <a href="courses.html">Courses</a>

    <a href="register.html">Register</a>

    <a href="contact.html">Contact</a>

</nav>
<header>

    <img
        src="images/logo.png"
        alt="Future Skills Learning Center logo"
        width="100"
    >

    <h1>
        Future Skills Learning Center
    </h1>

    <p>
        Learn. Build. Create. Grow.
    </p>

</header>
<form
    action="#"
    method="post"
>

</form>
<label for="fullName">
    Full Name
</label>

<input
    type="text"
    id="fullName"
    name="fullName"
    required
>
<label for="email">
    Email Address
</label>

<input
    type="email"
    id="email"
    name="email"
    required
>
<label for="phone">
    Telephone
</label>

<input
    type="tel"
    id="phone"
    name="phone"
><input type="text">

<input type="email">

<input type="tel">

<input type="date">

<input type="radio">

<input type="checkbox">

<input type="submit">

<input type="reset">

<fieldset>

    <legend>
        Preferred Study Mode
    </legend>

    <input
        type="radio"
        id="online"
        name="studyMode"
        value="online"
    >

    <label for="online">
        Online
    </label>


    <input
        type="radio"
        id="physical"
        name="studyMode"
        value="physical"
    >

    <label for="physical">
        In Person
    </label>


    <input
        type="radio"
        id="hybrid"
        name="studyMode"
        value="hybrid"
    >

    <label for="hybrid">
        Hybrid
    </label>

</fieldset>
<label for="course">
    Select Course
</label>

<select
    id="course"
    name="course"
    required
>

    <option value="">
        Choose a course
    </option>

    <option value="web-development">
        Web Development
    </option>

    <option value="computer-literacy">
        Computer Literacy
    </option>

    <option value="graphic-design">
        Graphic Design
    </option>

    <option value="english">
        English Language
    </option>

</select>
<label for="motivation">
    Why do you want to join?
</label>

<textarea
    id="motivation"
    name="motivation"
    rows="6"
    cols="50"
    required
></textarea>
<input
    type="text"
    id="fullName"
    name="fullName"
    minlength="3"
    maxlength="100"
    required
>
<input
    type="checkbox"
    id="terms"
    name="terms"
    required
>

<label for="terms">
    I confirm that the information
    provided is correct.
</label>
<button type="submit">
    Submit Application
</button>

<button type="reset">
    Clear Form
</button>
<footer>

    <p>
        &copy; 2026 Future Skills Learning Center.
        All rights reserved.
    </p>

    <p>
        <a href="contact.html">
            Contact Us
        </a>
    </p>

</footer>

</body>

</html>
